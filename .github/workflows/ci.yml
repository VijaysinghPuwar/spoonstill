name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A separate job because it is the one thing here that depends on the outside
  # world: an advisory published this morning fails this without a line of our
  # code changing, and that is the point (D-129). `--deny warnings` against the
  # triaged list in `.cargo/audit.toml` — the eighteen known ones pass, and
  # anything new stops the build until somebody looks at it and writes down what
  # they found.
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22
      - name: cargo audit
        run: cargo audit --deny warnings

  check:
    name: fmt · clippy · test
    # macOS is where ffmpeg-findings.md was measured, so this is the runner
    # whose results those numbers describe. Windows runs below (D-071).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml pins the version; this action honours it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The runner image stopped shipping it, and the suite renders real media.
      # The Windows job below has always installed its own; this one had not,
      # which went unnoticed because ci.yml watched a branch that is not this
      # repository's.
      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The release's asset names are a contract across three files that
      # nothing type-checks (D-125). Explicit, because a failure here means the
      # next tag publishes a release the installers cannot install.
      - name: Release asset names (D-125)
        run: cargo test -p spoonstill-cli --test release_assets

      # The M0 exit gate that matters (D-010). Kept as an explicit step, not
      # folded into `cargo test`, so a failure names the boundary in the log.
      - name: Architecture boundary (D-010)
        run: |
          cargo test -p spoonstill-cli --test architecture
          # spoonstill-core reaches nothing concrete, checked against the real
          # resolved dependency graph rather than the manifest alone.
          if cargo tree -p spoonstill-core -e normal \
               | grep -iE 'tauri|reqwest|elevenlabs|rusqlite|keyring'; then
            echo "::error::spoonstill-core has a concrete dependency (D-010)"
            exit 1
          fi

  # D-071 is Accepted as of 2026-08-26: the code is cross-platform from M1, so
  # this job is on. It is expected to be the first place a Windows-only mistake
  # shows up — `fs::rename` over an existing file, a path assumption, a missing
  # console flag.
  #
  # What this job does NOT do is validate ffmpeg-findings.md. Every number there
  # is macOS arm64 and stays unmeasured on Windows (findings §8). Green here
  # means "builds and behaves"; it does not mean "benchmarked".
  windows:
    name: windows · fmt · clippy · test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The test suite renders real media, so it needs the real binaries. It
      # builds its own fixtures in Rust rather than through gen-fixtures.sh,
      # precisely so that this job does not need bash.
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
