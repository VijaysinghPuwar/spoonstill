[package]
name = "spoonstill-media"
description = "FFmpeg/ffprobe process boundary, segment profile, probing."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
publish.workspace      = true

# D-012, resolved at M1: reimplement the ffmpeg-sidecar *pattern*, do not
# depend on the crate. Reasons in decisions.md — briefly: its auto-download is
# default-on and explicitly rejected (D-012), it offers no timeout-bounded
# ffprobe (plan.md M1 names probe hangs as a risk, and a timeout added after the
# first hang is a timeout added too late), and its stderr event classification
# is not something we may rely on anyway since raw stderr is retained
# regardless. What remains is a thin builder over std::process — which is what
# src/command.rs now is, at a fraction of the ~600 lines D-012 estimated.
[dependencies]
spoonstill-core = { workspace = true }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# D-106: captions are rasterized by us, not by FFmpeg. Homebrew core's `ffmpeg`
# formula — the one README.md and `still doctor --install` tell an operator to
# install — is the slim build: no libass, no libfreetype, so neither
# `subtitles` nor `drawtext` exists. Burning text with either would mean the
# feature is unavailable on the FFmpeg we already require. fontdue is pure
# Rust, no_std-capable, ~1200 lines of dependency, and rasterizes a glyph;
# everything above that — wrapping, outline, shadow, backdrop, compositing —
# is ours in src/caption.rs. `parallel` is left off deliberately: this runs
# inside the D-076 worker pool, and a nested rayon pool would compete with it
# for the cores that pool exists to budget.
fontdue = { version = "0.9", default-features = false, features = ["std"] }

[lints]
workspace = true
