[package]
name = "spoonstill-cli"
description = "The permanent, complete control surface. Ships first (D-010)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
publish.workspace      = true

# D-073: the product is `spoonstill`, the command is `still`. Crate names and
# binary names are independent, which is why `still` being taken on crates.io
# does not matter. `strip` is real at /usr/bin/strip and was avoided.
[[bin]]
name = "still"
path = "src/main.rs"

[dependencies]
spoonstill-app  = { workspace = true }
spoonstill-core = { workspace = true }
# The CLI is the permanent, complete control surface (D-010), so its help text
# and its error messages are product surface rather than scaffolding.
clap = { version = "4", features = ["derive"] }
# D-045 asks for graceful-then-forced cancellation. A hand-rolled signal handler
# would need `unsafe`, which the workspace forbids, and would not cover the
# Windows console control events that D-071 now puts in scope.
ctrlc = "3"

[dev-dependencies]
# Reads the workspace's own manifests to enforce D-010. A dev-dependency, so it
# never reaches a shipped binary and never appears in a runtime dependency tree.
toml = "1"

[lints]
workspace = true
