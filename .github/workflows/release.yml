name: release

# Tag a version and this publishes something an operator can actually download
# (D-087). Three CLI builds and three desktop bundles, each with the checksum
# the installers verify against.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# These are *unsigned preview* builds. Signing, notarization and a bundled
# LGPL FFmpeg are M5 (D-062) — until then the README tells the operator why
# Gatekeeper and SmartScreen object, and the installers use the system FFmpeg.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.0"
        required: true

# Read by default; the three jobs that touch the release ask for `write`
# themselves (D-125). Nothing here needs to write to the repository, and a
# workflow-wide `contents: write` hands it to every step including the ones
# that only compile.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One draft release up front, so every matrix leg uploads into the same place
  # and a half-finished set of assets is never visible to anyone.
  draft:
    name: draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # D-102: the tag is the version, so nothing else may disagree with it.
      # v0.1.1 and v0.1.2 both shipped binaries that answered `--version` with
      # 0.1.0, and an MSI named for it, because the tag was the only place the
      # number was ever written. Fail here, before twelve assets are built.
      - name: The tag, Cargo.toml and tauri.conf.json state one version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          want="${TAG#v}"
          cargo_v=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          tauri_v=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' apps/desktop/tauri.conf.json)
          echo "tag=$want cargo=$cargo_v tauri=$tauri_v"
          if [ "$want" != "$cargo_v" ] || [ "$want" != "$tauri_v" ]; then
            echo "::error::Tag $TAG wants $want; Cargo.toml says $cargo_v and tauri.conf.json says $tauri_v. Bump them in a commit, then move the tag onto it."
            exit 1
          fi

      - name: Create or reuse the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading into it."
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --title "spoonstill $TAG" \
            --notes "$(cat <<'NOTES'
          Turn a folder of photos and narration into one MP4, with Ken Burns
          motion on every still and the cuts on the narration's own boundaries.

          ## Get the app

          The one-line installer below is the way that does not argue with
          Gatekeeper. If you would rather click:

          **macOS** — download **spoonstill-macOS.dmg** below
          1. Open the `.dmg` and drag spoonstill to Applications
          2. First launch is blocked — see **Opening it the first time**, below
          3. Drop a folder of photos in, press Render

          **Windows** — download **spoonstill-Windows-Installer.exe** below
          1. Double-click it and follow the wizard
          2. If SmartScreen objects: **More info > Run anyway**
          3. Launch spoonstill from the Start Menu

          The `.msi` is the same app for anyone who deploys with one.

          ## Get the command line

          The CLI is the complete control surface — the window owns no logic
          the command line does not have (D-010). One line installs it and
          verifies its checksum first:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/VijaysinghPuwar/spoonstill/master/scripts/install.sh | bash
          ```
          ```powershell
          irm https://raw.githubusercontent.com/VijaysinghPuwar/spoonstill/master/scripts/install.ps1 | iex
          ```

          Or take the archive for your machine below — **still-macOS-AppleSilicon**,
          **still-macOS-Intel**, or **still-Windows** — and put `still` on your PATH.

          ```bash
          still new ~/film ~/Photos/*.jpg ~/Recordings/*.m4a
          still render ~/film --out film.mp4
          ```

          ## Requirements

          - **FFmpeg**, which is not bundled yet (D-062 — a shipped build needs
            its own LGPL build first). Install it once:
            `brew install ffmpeg` / `winget install Gyan.FFmpeg`
          - **macOS 12 or later**, or **Windows 10/11 (64-bit)**
          - For narration read aloud by a neural voice: `pipx install edge-tts`,
            and an internet connection while it speaks. Your own recordings and
            silent scenes need neither.

          ## Opening it the first time

          These are preview builds — unsigned, un-notarized, no updater. macOS
          marks anything downloaded through a browser as quarantined, and for
          an unsigned app it shows:

          > **"spoonstill" Not Opened** — Apple could not verify "spoonstill"
          > is free of malware... **[Move to Trash] [Done]**

          Press **Done**, never Move to Trash. Then either:

          - **System Settings > Privacy & Security**, scroll down, **Open Anyway**, or
          - `xattr -dr com.apple.quarantine /Applications/spoonstill.app`

          Right-click > Open is the advice everywhere on the internet and
          **Apple removed it in macOS 15** — it does nothing on 15 or later.

          The one-line installer above avoids all of this: it verifies the
          checksum, installs the app, and clears the quarantine attribute
          itself, so the first launch is just the app opening.

          On Windows, SmartScreen says the publisher is unknown: **More info >
          Run anyway**.

          Signing and notarization are M5 work rather than an oversight. Every
          asset has a `.sha256` beside it, and the installers refuse to install
          anything whose checksum does not match.
          NOTES
          )"

  # The command line, which is the complete control surface (D-010). Three
  # native builds — no cross-compilation, because the test suite that proves a
  # target works has to be able to run there.
  cli:
    name: still · ${{ matrix.target }}
    needs: draft
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            # What the file is called on the release page and in the operator's
            # Downloads folder (D-098). `aarch64-apple-darwin` is precise and
            # answers the wrong question: the person choosing has a Mac, not a
            # triple.
            pretty: still-macOS-AppleSilicon
            smoke: true
          # Cross-compiled, not native — GitHub no longer serves `macos-13`
          # runners (two runs sat queued 15+ minutes and never started). Apple's
          # linker targets both architectures from either, so this builds; it is
          # **not** covered by the test suite, which runs on arm64 only. See
          # D-087's amendment.
          - os: macos-14
            target: x86_64-apple-darwin
            archive: tar.gz
            pretty: still-macOS-Intel
            smoke: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
            pretty: still-Windows
            smoke: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.draft.outputs.tag }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # `rust-toolchain.toml` pins 1.94.0, and a pin wins over whatever the
      # action installed — so the action added this target to *stable* while
      # `cargo build` uses the pinned toolchain, which has only the host's.
      # That is invisible on a native leg and fatal on a cross-compiled one:
      # `x86_64-apple-darwin` on an arm64 runner failed with `can't find crate
      # for std` while every other leg passed. Adding it here targets whichever
      # toolchain is actually active.
      - name: Add the target to the pinned toolchain
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p spoonstill-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          name="${{ matrix.pretty }}.tar.gz"
          # The notices travel with the binary, because the font compiled into
          # it is under a licence that asks each copy to carry it (D-124).
          # Staged beside the binary so the archive has no directory in it —
          # `tar -C` takes one directory, and an operator extracting into
          # ~/Downloads should get two files, not a folder.
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/still" "$stage/"
          cp THIRD-PARTY-NOTICES.md "$stage/"
          tar -czf "$name" -C "$stage" still THIRD-PARTY-NOTICES.md
          shasum -a 256 "$name" > "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          $name = "${{ matrix.pretty }}.zip"
          # See the unix step: the notices ship with the binary (D-124).
          $files = @("target/${{ matrix.target }}/release/still.exe", "THIRD-PARTY-NOTICES.md")
          Compress-Archive -Path $files -DestinationPath $name -Force
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          # Same two-field shape `shasum -c` writes, so one installer format serves both.
          "$hash  $name" | Out-File -FilePath "$name.sha256" -Encoding ascii -NoNewline
          "ASSET=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Only where it can actually execute: the arm64 runner has no Rosetta, so
      # the cross-compiled Intel binary is checked by `file`, not by running it.
      - name: Smoke test the binary that is about to ship
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/still"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" --version
          "$bin" --help > /dev/null

      - name: Check the cross-compiled binary is the architecture it claims
        if: ${{ !matrix.smoke }}
        shell: bash
        run: |
          file "target/${{ matrix.target }}/release/still" | tee /dev/stderr | grep -q "x86_64" \
            || { echo "::error::not an x86_64 binary"; exit 1; }

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # The window. Same binary logic underneath — the shell owns none of it (D-010).
  desktop:
    name: app · ${{ matrix.target }}
    needs: draft
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs on both Macs, rather than asking the operator
          # which processor they have. Tauri lipos the two slices together, so
          # the arm64 runner produces the whole thing.
          - os: macos-14
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.draft.outputs.tag }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Same reason as the CLI job above: the pin in `rust-toolchain.toml`
      # decides which toolchain builds, so the targets have to be added to it.
      # A universal .dmg needs both Mac slices, and one of them is a cross
      # compile however you look at it.
      - name: Add the targets to the pinned toolchain
        shell: bash
        run: |
          for target in $(echo "${{ matrix.rust-targets }}" | tr ',' ' '); do
            rustup target add "$target"
          done

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-${{ matrix.target }}

      # There is no npm build step: `frontendDist` is a folder of static files.
      - uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0
      - name: Install the Tauri CLI
        # `-y` *is* `--no-confirm`; binstall rejects the pair as one argument twice.
        # An exact version, not a range (D-125). `^2` resolves at release
        # time, so two tags cut a week apart could bundle with two different
        # CLIs and nothing would record which. 2.11.4 is the current stable and
        # matches the `tauri` crate `Cargo.lock` pins at 2.11.5.
        run: cargo binstall --no-confirm tauri-cli --version '=2.11.4'

      - name: Bundle
        # `--locked` for the same reason the CLI job has it: a release is built
        # from the dependency versions that were tested, not from whatever
        # resolved this morning (D-125).
        run: >
          cargo tauri build --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }} -- --locked
        working-directory: apps/desktop

      - name: Collect and checksum
        shell: bash
        run: |
          out="dist"; mkdir -p "$out"
          # Tauri names its bundles `spoonstill_0.1.0_x64_en-US.msi`, which
          # carries a version the tag already states and a locale nobody chose.
          # Renamed on the way out (D-098): the person downloading is choosing
          # an operating system, so the file is named after one.
          find "target/${{ matrix.target }}/release/bundle" -type f -name '*.dmg' \
               -exec cp {} "$out/spoonstill-macOS.dmg" \;
          find "target/${{ matrix.target }}/release/bundle" -type f -name '*-setup.exe' \
               -exec cp {} "$out/spoonstill-Windows-Installer.exe" \;
          find "target/${{ matrix.target }}/release/bundle" -type f -name '*.msi' \
               -exec cp {} "$out/spoonstill-Windows-Installer.msi" \;
          ls -1 "$out" | grep . || { echo "::error::the bundler produced nothing"; exit 1; }
          cd "$out"
          sum() { if command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1"; else sha256sum "$1"; fi; }
          for f in *; do sum "$f" > "$f.sha256"; done
          ls -l

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  publish:
    name: publish
    needs: [draft, cli, desktop]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -euo pipefail

          # The exact set, not a count (D-125). A count of twelve is satisfied
          # by twelve *wrong* files — a leg that uploaded a stale asset from a
          # re-run, or a rename that D-098 warns turns every installer into a
          # 404. These names are the contract `install.sh` and `install.ps1`
          # construct, and a test in the workspace asserts they still agree.
          expected=$(cat <<'NAMES'
          spoonstill-Windows-Installer.exe
          spoonstill-Windows-Installer.exe.sha256
          spoonstill-Windows-Installer.msi
          spoonstill-Windows-Installer.msi.sha256
          spoonstill-macOS.dmg
          spoonstill-macOS.dmg.sha256
          still-Windows.zip
          still-Windows.zip.sha256
          still-macOS-AppleSilicon.tar.gz
          still-macOS-AppleSilicon.tar.gz.sha256
          still-macOS-Intel.tar.gz
          still-macOS-Intel.tar.gz.sha256
          NAMES
          )
          expected=$(echo "$expected" | sed 's/^ *//' | grep . | sort)

          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)

          missing=$(comm -23 <(echo "$expected") <(echo "$actual") || true)
          extra=$(comm -13 <(echo "$expected") <(echo "$actual") || true)

          if [ -n "$missing" ]; then
            echo "::error::these assets are missing:"; echo "$missing"
          fi
          if [ -n "$extra" ]; then
            # Loud, not fatal: an asset nobody expected is a mistake worth
            # seeing, but it is not a reason to withhold a complete release.
            echo "::warning::these assets were not expected:"; echo "$extra"
          fi
          [ -z "$missing" ] || exit 1

          # Every checksum verified against the file it names, before anyone can
          # download either. The installers check this too — and finding out
          # here costs a re-run, while finding out there costs an operator a
          # release that refuses to install.
          work=$(mktemp -d); cd "$work"
          gh release download "$TAG" --clobber
          for sum in *.sha256; do
            sha256sum -c "$sum"
          done

          echo "12 assets, every checksum verified"
          gh release edit "$TAG" --draft=false --latest
