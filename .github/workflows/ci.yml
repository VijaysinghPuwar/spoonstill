name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    # D-071 is Open; its recorded default is macOS-first through M3, so macOS is
    # the only runner for now. The Windows job below is deliberately left in
    # place rather than deleted — see the comment on it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; this action honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The M0 exit gate that matters (D-010). Kept as an explicit step, not
      # folded into `cargo test`, so a failure names the boundary in the log.
      - name: Architecture boundary (D-010)
        run: |
          cargo test -p spoonstill-cli --test architecture
          # spoonstill-core reaches nothing concrete, checked against the real
          # resolved dependency graph rather than the manifest alone.
          if cargo tree -p spoonstill-core -e normal \
               | grep -iE 'tauri|reqwest|elevenlabs|rusqlite|keyring'; then
            echo "::error::spoonstill-core has a concrete dependency (D-010)"
            exit 1
          fi

  # D-071 — Windows first-class from M4, not now. This job is present and
  # disabled rather than absent, because plan.md M0 asks for exactly that: the
  # reason lives next to the thing it disables.
  #
  # Turning it on also requires re-measuring ffmpeg-findings.md on Windows —
  # every number in that file is macOS arm64 — so this is not a one-line change.
