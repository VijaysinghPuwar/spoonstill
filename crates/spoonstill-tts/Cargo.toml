[package]
name = "spoonstill-tts"
description = "TTS provider trait plus ElevenLabs and Edge implementations."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
publish.workspace      = true

[dependencies]
spoonstill-core = { workspace = true }
# D-081: a provider that shells out uses the one process boundary rather than
# growing a second one. `edge` spawns `edge-tts` through
# `spoonstill_media::command`, which is where argument vectors, timeouts,
# retained stderr and the paste-ready command line already live (D-011).
spoonstill-media = { workspace = true }

