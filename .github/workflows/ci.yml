name: ci

on:
  push:
    branches: [master]
  pull_request:

# Read-only by default. Only `installer-macos` uses the token at all, to ask
# which release is the latest without sharing the anonymous per-IP rate limit
# with every other runner on that address (D-136). Nothing here writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A separate job because it is the one thing here that depends on the outside
  # world: an advisory published this morning fails this without a line of our
  # code changing, and that is the point (D-129). `--deny warnings` against the
  # triaged list in `.cargo/audit.toml` — the eighteen known ones pass, and
  # anything new stops the build until somebody looks at it and writes down what
  # they found.
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version ^0.22
      - name: cargo audit
        run: cargo audit --deny warnings

  check:
    name: fmt · clippy · test
    # macOS is where ffmpeg-findings.md was measured, so this is the runner
    # whose results those numbers describe. Windows runs below (D-071).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml pins the version; this action honours it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The runner image stopped shipping it, and the suite renders real media.
      # The Windows job below has always installed its own; this one had not,
      # which went unnoticed because ci.yml watched a branch that is not this
      # repository's.
      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The release's asset names are a contract across three files that
      # nothing type-checks (D-125). Explicit, because a failure here means the
      # next tag publishes a release the installers cannot install.
      - name: Release asset names (D-125)
        run: cargo test -p spoonstill-cli --test release_assets

      # The M0 exit gate that matters (D-010). Kept as an explicit step, not
      # folded into `cargo test`, so a failure names the boundary in the log.
      - name: Architecture boundary (D-010)
        run: |
          cargo test -p spoonstill-cli --test architecture
          # spoonstill-core reaches nothing concrete, checked against the real
          # resolved dependency graph rather than the manifest alone.
          if cargo tree -p spoonstill-core -e normal \
               | grep -iE 'tauri|reqwest|elevenlabs|rusqlite|keyring'; then
            echo "::error::spoonstill-core has a concrete dependency (D-010)"
            exit 1
          fi

  # D-071 is Accepted as of 2026-08-26: the code is cross-platform from M1, so
  # this job is on. It is expected to be the first place a Windows-only mistake
  # shows up — `fs::rename` over an existing file, a path assumption, a missing
  # console flag.
  #
  # What this job does NOT do is validate ffmpeg-findings.md. Every number there
  # is macOS arm64 and stays unmeasured on Windows (findings §8). Green here
  # means "builds and behaves"; it does not mean "benchmarked".
  windows:
    name: windows · fmt · clippy · test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The test suite renders real media, so it needs the real binaries. It
      # builds its own fixtures in Rust rather than through gen-fixtures.sh,
      # precisely so that this job does not need bash.
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # --- The installers, actually executed ------------------------------------
  #
  # `install.ps1` had never run anywhere — not on the author's machine, which
  # has no PowerShell (D-128), and not in CI. `install.sh` had never run in CI
  # either. Both are the first thing a stranger executes, both are piped
  # straight into a shell, and neither had one proving run behind it. That is
  # the only place in this project where code reaches a person having never
  # been executed at all.
  #
  # Like `audit` above, these jobs depend on the outside world: they install
  # from the **latest published release**, so they fail if that release is
  # missing or malformed. That is deliberate. D-098 and D-125 are both about a
  # release that looks complete while every installer 404s, and this is the
  # only check that would notice — the publish gate asserts the asset *names*,
  # while this asserts that downloading and verifying them actually works.
  #
  # Both run the script from the checkout, not from `raw.githubusercontent`, so
  # a pull request tests its own change rather than what is already on master.
  installer-macos:
    name: installer · macOS
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Not `$HOME/.local/bin`: installing somewhere the runner does not
      # already have on PATH is what makes the script's closing PATH advice
      # reachable, instead of skipped because the directory was already listed.
      #
      # Set per step rather than on the job: the `runner` context is not
      # available in a job-level `env`, and a workflow that references it there
      # is rejected whole — no jobs, no logs (D-136).
      - name: Run install.sh
        env:
          SPOONSTILL_INSTALL_DIR: ${{ runner.temp }}/spoonstill-bin
        run: bash scripts/install.sh

      # The installed binary must run, and it must be the version the release
      # says it is. `still --version` answering the wrong number is exactly
      # D-102, and this catches it from the outside — on a downloaded artifact,
      # rather than from the workspace manifest that D-102 already pins.
      - name: The installed CLI runs, and is the released version
        env:
          SPOONSTILL_INSTALL_DIR: ${{ runner.temp }}/spoonstill-bin
        run: |
          set -euo pipefail
          still="$SPOONSTILL_INSTALL_DIR/still"
          test -x "$still" || { echo "::error::install.sh left no executable at $still"; exit 1; }
          got=$("$still" --version)
          tag=$(gh release view --json tagName -q .tagName)
          echo "still --version -> $got"
          echo "latest release   -> $tag"
          case "$got" in
            *"${tag#v}"*) ;;
            *) echo "::error::'$got' does not carry the released version $tag (D-102)"; exit 1 ;;
          esac

      # D-099: the whole reason install.sh clears the quarantine attribute is
      # that the dialog an unsigned .dmg produces offers "Move to Trash" as its
      # brightest button, and "right-click > Open" stopped working in macOS 15.
      # If the attribute survives, the operator meets that dialog.
      - name: The window was installed, and is not quarantined
        run: |
          set -euo pipefail
          app=""
          for dir in "/Applications" "$HOME/Applications"; do
            found=$(find "$dir" -maxdepth 1 -iname '*spoonstill*.app' -print -quit 2>/dev/null || true)
            if [ -n "$found" ]; then app="$found"; break; fi
          done
          test -n "$app" || { echo "::error::install.sh installed no .app"; exit 1; }
          echo "installed at $app"
          if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
            echo "::error::$app is still quarantined (D-099)"; exit 1
          fi
          echo "no com.apple.quarantine attribute"

  installer-windows:
    name: installer · Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run install.ps1
        shell: pwsh
        env:
          SPOONSTILL_INSTALL_DIR: ${{ runner.temp }}\spoonstill-bin
        run: ./scripts/install.ps1

      # D-128: `install.ps1` tested PATH membership by substring, so a
      # `...\spoonstill\bin-old` entry counted as `...\spoonstill\bin` and the
      # real folder was never added — `still` not found after an install that
      # reported success. That fix is executed here for the first time.
      - name: The installed CLI runs, and its folder is on the user PATH
        shell: pwsh
        env:
          SPOONSTILL_INSTALL_DIR: ${{ runner.temp }}\spoonstill-bin
        run: |
          $ErrorActionPreference = 'Stop'
          $still = Join-Path $env:SPOONSTILL_INSTALL_DIR 'still.exe'
          if (-not (Test-Path $still)) {
            Write-Host "::error::install.ps1 left no still.exe at $still"
            exit 1
          }
          $got = & $still --version
          Write-Host "still --version -> $got"

          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $wanted = $env:SPOONSTILL_INSTALL_DIR.TrimEnd('\')
          $onPath = $false
          foreach ($entry in ($userPath -split ';')) {
            if ($entry.Trim().TrimEnd('\') -eq $wanted) { $onPath = $true; break }
          }
          if (-not $onPath) {
            Write-Host "::error::$wanted was not added to the user PATH (D-128)"
            exit 1
          }
          Write-Host "on the user PATH"

  # --- The exit gates, on a machine that is not the author's -----------------
  #
  # `make gates` is what README.md calls "the honest answer to does this work?"
  # — 29 checks that render real media and assert real properties. It ran in no
  # CI job at all: the gates had only ever executed on the author's laptop, and
  # D-131's "the shell gates stay macOS-only" reads as though they run on the
  # macOS runner. They did not run anywhere.
  #
  # macOS only, and that part of D-131 is unchanged: these are bash, and the
  # Windows leg's `cargo test --workspace` already renders real media through
  # real FFmpeg.
  #
  # It repeats the fmt/clippy/test that `check` above also runs, because M0
  # gates 2 through 4 *are* those commands — the duplication is the gate saying
  # what it promises rather than pointing at another job and hoping.
  gates:
    name: exit gates · macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # M0's fifth gate is `git log --oneline | tail -1`, which asserts the
          # planning corpus is the first commit. checkout defaults to depth 1,
          # where that line is HEAD and the gate fails. Verified against a real
          # `git clone --depth 1` before this job was written.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install FFmpeg
        run: brew install ffmpeg

      # `edge-tts` is deliberately not installed. M2's gate 7 has two halves and
      # this exercises the one the author's machine cannot: without a provider,
      # a written line must make the render **fail and name the missing tool**,
      # never quietly substitute silence for something somebody wrote (D-020).
      - name: make gates
        run: make gates
